<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" role="img" aria-label="명상하는 사람과 고양이들">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="400" rx="20" fill="url(#bg)"/>

  <!-- 별 -->
  <g fill="#fff">
    <circle cx="80" cy="50" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="90" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="60" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="110" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="40" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 무지개 (보리를 위한 자리) -->
  <g fill="none" stroke-width="6" opacity=".5">
    <path d="M40 150 A70 70 0 0 1 180 150" stroke="#f87171"/>
    <path d="M52 150 A58 58 0 0 1 168 150" stroke="#fbbf24"/>
    <path d="M64 150 A46 46 0 0 1 156 150" stroke="#60a5fa"/>
  </g>
  <text x="110" y="172" font-size="13" fill="#c7d2fe" text-anchor="middle" font-family="sans-serif">Bori</text>

  <!-- 문구 -->
  <text x="400" y="48" font-size="20" fill="#e0e7ff" text-anchor="middle" font-family="sans-serif">Code is my meditation, System is my garden.</text>

  <!-- 오라 (호흡) -->
  <circle cx="400" cy="210" r="120" fill="url(#aura)">
    <animate attributeName="r" values="105;135;105" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 바닥 매트 -->
  <ellipse cx="400" cy="305" rx="125" ry="12" fill="#1e1b4b" opacity=".7"/>

  <!-- 명상하는 사람 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
    <ellipse cx="400" cy="285" rx="78" ry="20" fill="#4f46e5"/>
    <path d="M360 282 Q358 190 400 182 Q442 190 440 282 Z" fill="#6366f1"/>
    <path d="M368 205 Q348 250 385 272" fill="none" stroke="#818cf8" stroke-width="14" stroke-linecap="round"/>
    <path d="M432 205 Q452 250 415 272" fill="none" stroke="#818cf8" stroke-width="14" stroke-linecap="round"/>
    <circle cx="400" cy="272" r="9" fill="#fcd9b6"/>
    <circle cx="400" cy="152" r="28" fill="#fcd9b6"/>
    <path d="M372 150 Q374 122 400 122 Q426 122 428 150 Q412 136 400 136 Q388 136 372 150Z" fill="#1e1b4b"/>
    <path d="M388 156 q5 4 10 0 M402 156 q5 4 10 0" stroke="#1e1b4b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M394 169 q6 4 12 0" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 떠오르는 마음의 입자 -->
  <g fill="#c7d2fe">
    <circle cx="370" cy="120" r="3"><animate attributeName="cy" values="130;40" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="120" r="2.5"><animate attributeName="cy" values="130;50" dur="6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="110" r="2"><animate attributeName="cy" values="120;30" dur="7s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 오른쪽: 앉아있는 치즈 고양이 -->
  <g>
    <path d="M650 295 Q695 290 686 252" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-10 650 295;16 650 295;-10 650 295" dur="2s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="620" cy="272" rx="32" ry="36" fill="#fbbf24"/>
    <ellipse cx="608" cy="304" rx="9" ry="5" fill="#fde68a"/>
    <ellipse cx="632" cy="304" rx="9" ry="5" fill="#fde68a"/>
    <circle cx="620" cy="222" r="26" fill="#fbbf24"/>
    <polygon points="598,206 602,178 620,198" fill="#fbbf24"/>
    <polygon points="642,206 638,178 620,198" fill="#fbbf24"/>
    <ellipse cx="610" cy="222" rx="3.5" ry="5" fill="#1f2937">
      <animate attributeName="ry" values="5;5;.5;5;5" keyTimes="0;.9;.94;.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="630" cy="222" rx="3.5" ry="5" fill="#1f2937">
      <animate attributeName="ry" values="5;5;.5;5;5" keyTimes="0;.9;.94;.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <polygon points="616,230 624,230 620,235" fill="#f472b6"/>
    <path d="M600 232 L586 229 M600 236 L586 238 M640 232 L654 229 M640 236 L654 238" stroke="#fff" stroke-width="1" opacity=".8"/>
  </g>

  <!-- 왼쪽: 잠자는 고양이 -->
  <g>
    <ellipse cx="190" cy="290" rx="45" ry="22" fill="#9ca3af">
      <animate attributeName="ry" values="22;25;22" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M148 296 Q130 280 150 270" fill="none" stroke="#9ca3af" stroke-width="9" stroke-linecap="round"/>
    <circle cx="228" cy="294" r="16" fill="#9ca3af"/>
    <polygon points="216,284 218,270 228,280" fill="#9ca3af"/>
    <polygon points="240,284 238,270 228,280" fill="#9ca3af"/>
    <path d="M220 294 q4 3 8 0 M230 294 q4 3 8 0" stroke="#1f2937" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g font-family="sans-serif" fill="#c7d2fe" font-size="14">
      <text x="250" y="270">z<animate attributeName="y" values="270;230" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></text>
      <text x="262" y="260" font-size="18">Z<animate attributeName="y" values="260;215" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- 하단: 걸어가는 검은 고양이 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80 0;880 0" dur="22s" repeatCount="indefinite"/>
    <g fill="#111827" stroke="#111827">
      <ellipse cx="0" cy="368" rx="22" ry="10" stroke="none"/>
      <circle cx="24" cy="358" r="9" stroke="none"/>
      <polygon points="18,352 20,342 25,350" stroke="none"/>
      <polygon points="30,352 32,342 26,350" stroke="none"/>
      <path d="M-22 366 Q-38 352 -30 338" fill="none" stroke-width="4" stroke-linecap="round"/>
      <path d="M-12 374 L-12 386" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-20 -12 374;20 -12 374;-20 -12 374" dur=".8s" repeatCount="indefinite"/>
      </path>
      <path d="M14 374 L14 386" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="20 14 374;-20 14 374;20 14 374" dur=".8s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="27" cy="357" r="1.5" fill="#fde047"/>
  </g>
</svg>
